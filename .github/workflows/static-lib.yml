# Builds Win2D as static libraries (winrt.lib + win2dmod.lib) per platform and uploads them as
# workflow artifacts. See static/README.md.
name: static-lib

on:
  push:
    branches: [static-lib]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-lib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win2d-static-${{ matrix.platform }}
    # windows-2022: Visual Studio 2022 17.14 (v143, MSVC 14.44) and Windows SDK 10.0.22621.
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure Windows SDK 10.0.22621 and MSVC 14.44
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -property installationPath
          Write-Host "Visual Studio: $vs ($(& $vswhere -latest -products * -version '[17.0,18.0)' -property catalog_productDisplayVersion))"
          $add = @()
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\um\windows.h')) {
            $add += 'Microsoft.VisualStudio.Component.Windows11SDK.22621'
          }
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name
          Write-Host "Installed MSVC toolsets: $($msvc -join ', ')"
          if (-not ($msvc | Where-Object { $_ -like '14.44.*' })) {
            $add += 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64'
          }
          if ($add) {
            Write-Host "Installing: $($add -join ', ')"
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
            $argList = @('modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--nocache') + ($add | ForEach-Object { '--add', $_ })
            $p = Start-Process $installer -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Select-Object -ExpandProperty Name

      - name: Build
        run: ./static/build-static.ps1 -Platform ${{ matrix.platform }} -OutDir "${{ github.workspace }}/static/out/${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win2d-static-${{ matrix.platform }}
          path: static/out/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ matrix.platform }}
          path: static/logs/
          if-no-files-found: ignore
          retention-days: 7
