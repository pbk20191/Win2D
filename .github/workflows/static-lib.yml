# Builds Win2D as static libraries (winrt.lib + win2dmod.lib + their PDBs) per platform and
# uploads them as workflow artifacts. Pushing a tag win2d-static-v<version> also publishes them
# as a GitHub Release. See static/README.md.
name: static-lib

on:
  push:
    branches: [static-lib]
    tags: ['win2d-static-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-lib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: win2d-static-${{ matrix.platform }}
    # windows-2022: Visual Studio 2022 17.14 (v143, MSVC 14.44) and Windows SDK 10.0.22621.
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure Windows SDK 10.0.22621 and MSVC 14.44
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $range = '[17.0,18.0)'
          $vs = & $vswhere -latest -products * -version $range -property installationPath
          $vsVer = & $vswhere -latest -products * -version $range -property catalog_productDisplayVersion
          Write-Host "Visual Studio: $vs ($vsVer)"
          $add = @()
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\um\windows.h')) {
            $add += 'Microsoft.VisualStudio.Component.Windows11SDK.22621'
          }
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name
          Write-Host "Installed MSVC toolsets: $($msvc -join ', ')"
          if (-not ($msvc | Where-Object { $_ -like '14.44.*' })) {
            $add += 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64'
          }
          if ($add) {
            Write-Host "Installing: $($add -join ', ')"
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
            $argList = @('modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--nocache') + ($add | ForEach-Object { '--add', $_ })
            $p = Start-Process $installer -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($p.ExitCode)" }
          }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory | Select-Object -ExpandProperty Name

      - name: Build
        run: ./static/build-static.ps1 -Platform ${{ matrix.platform }} -OutDir "${{ github.workspace }}/static/out/${{ matrix.platform }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win2d-static-${{ matrix.platform }}
          path: static/out/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ matrix.platform }}
          path: static/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: release
    # Only for release tags, and only after both matrix legs succeeded.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/win2d-static-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: win2d-static-*
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          version="${TAG#win2d-static-v}"
          mkdir -p dist
          for platform in x64 ARM64; do
            src="artifacts/win2d-static-${platform}"
            for f in winrt.lib winrt.pdb win2dmod.lib win2dmod.pdb BUILDINFO.txt; do
              test -f "$src/$f" || { echo "::error::$src/$f is missing"; exit 1; }
            done
            (cd "$src" && zip -9 -X -q "$GITHUB_WORKSPACE/dist/win2d-static-${version}-${platform}.zip" *)
          done
          (cd dist && sha256sum win2d-static-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l dist
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          set -euo pipefail
          readme="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/static/README.md"
          {
            echo "Unofficial, unsupported build of [Win2D](https://github.com/microsoft/Win2D) (MIT license) as static libraries, for linking Win2D straight into an exe such as a .NET NativeAOT app. Microsoft does not build, test or support it."
            echo
            echo "- **Win2D source:** microsoft/Win2D \`25680382\` (\`25680382dd2136779e10ea6084f0c5ba437ae288\`, Win2D-WinUI 1.4.0), plus only the files under \`static/\` on [static-lib](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}) (\`${GITHUB_SHA}\`)."
            echo "- **Toolset:** MSVC 14.44.x (v143, see \`BUILDINFO.txt\` for the exact \`cl\` version), Windows SDK 10.0.22621, Release, no LTCG."
            echo "- **CRT model:** hybrid. The objects are \`/MT\` (\`RuntimeLibrary=MT_StaticRelease\`, LIBCMT/libcpmt, \`_ITERATOR_DEBUG_LEVEL=0\`) and expect the final link to use the dynamic UCRT (\`/NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib\`), as NativeAOT does."
            echo "- **Debug info:** \`winrt.pdb\` and \`win2dmod.pdb\` are the compiler PDBs the objects reference. Keep them next to the .lib files, and the link finds them (no LNK4099) and the exe's PDB gets Win2D symbols."
            echo "- **Platforms:** x64 is build-verified and smoke-tested (a NativeAOT probe linked against it runs). **ARM64 is build-verified only** (machine types checked); it has not been run."
            echo
            echo "**How to consume:** see [static/README.md](${readme}). Download the zip for your RID (\`x64\` for \`win-x64\`, \`ARM64\` for \`win-arm64\`), unzip it, and point the csproj at that folder."
            echo
            echo "Each zip holds \`winrt.lib\`, \`winrt.pdb\`, \`win2dmod.lib\`, \`win2dmod.pdb\` and \`BUILDINFO.txt\`. \`SHA256SUMS.txt\` lists the zips' SHA-256 hashes."
          } > notes.md
          cat notes.md

      - name: Create release
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag \
            --title "Win2D static libraries ${VERSION} (unofficial)" \
            --notes-file notes.md \
            dist/win2d-static-*.zip dist/SHA256SUMS.txt
          gh release view "$TAG"
